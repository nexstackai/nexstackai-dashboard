services:

  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: database
      DB_NAME: dashboard
      DB_USER: admin
      DB_PASSWORD: example
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: example
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: